 <div class="tabs">${[['60sn','60 Saniye'],['fayda','Hasta Faydası'],['calisma','Çalışmalar'],['form','Form / Fiyat'],['rakip','Rakipler'],['odeme','SUT / ICD / Ödeme']].map(x=>`<button class="tab ${t===x[0]?'active':''}" onclick="openProduct('${id}','${x[0]}')">${x[1]}</button>`).join('')}</div>
 ${renderTab(id,t)}`;
}
function renderTab(id,t){
 const p=DATA[id];
 if(t==='60sn') return `<div class="panel"><b>Uzman hekimi seç</b><div style="margin-top:8px">${specs(p).map(s=>`<button class="spec ${s===spec?'active':''}" onclick="chooseSpec('${id}','${s}')">${s}</button>`).join('')}</div></div>${scriptCard(id,spec)}`;
 if(t==='fayda') return `<div class="card"><h3 style="margin-top:0">Hastaya sağlayabileceği faydalar</h3>${(p.benefits||[]).map(x=>`<div class="row"><div>✓ ${esc(x)}</div></div>`).join('')}<h3>Hekim açısından pratik avantajlar</h3>${(p.advantages||[]).map(x=>`<div class="row"><div>• ${esc(x)}</div></div>`).join('')}<div class="notice" style="margin-top:10px">Mutlak üstünlük / garanti dili kullanma. Faydayı uygun hasta, çalışma kanıtı ve güncel KÜB çerçevesinde anlat.</div></div>`;
 if(t==='calisma') return `<div class="ok" style="margin-bottom:10px"><b>Her çalışmada:</b> tasarım + hasta grubu + sonuç + sahada ne işe yarar + dikkat noktası var.</div>${p.studies.map(studyCard).join('')}`;
 if(t==='form') return `<div class="card"><h3 style="margin-top:0">Formlar ve fiyatlar</h3><div class="ok">Fiyat kontrol tarihi: <b>${p.price_date}</b></div>${p.forms.map(x=>`<div class="row"><div><b>${x.form}</b><div class="muted">${x.pack}</div></div><div class="value">${x.price}</div></div>`).join('')}${p.name==='Calira-Met XR'?'<div class="notice">Form/kutu adedini aktif barkod ve güncel fiyat listesinde saha günü tekrar kontrol et.</div>':''}</div>`;
 if(t==='rakip') return `<div class="card"><h3 style="margin-top:0">Rakipler</h3>${p.competitors.map(compCard).join('')}</div>`;
 if(t==='odeme') return `<div class="ok" style="margin-bottom:10px"><b>Kontrol:</b> ${esc(p.sut_checked||'')}<br>${esc(p.sut||'')}</div>${(p.reimbursement||[]).map(paymentCard).join('')}<div class="danger"><b>Önemli:</b> Bu ekran saha/rapor hazırlık kontrol listesidir. Nihai ödeme kararı MEDULA ve yürürlükteki SGK SUT/EK-4A-EK-4F kayıtlarına bağlıdır. ICD alt kodu ve aktif barkod reçete günü doğrulanmalıdır.</div>`;
 return '';
}
function chooseSpec(id,s){spec=s;openProduct(id,'60sn')}
function scriptCard(id,s){
 const p=DATA[id],x=p.scripts[s];
 return `<div class="script"><h3>${p.name} → ${s}</h3><div class="focus">${esc(x.focus)}</div>
 <div class="ok"><b>Hangi hasta?</b><br>${esc(x.patient||'KÜB/SUT’a uygun hasta')}</div>
 <h4 style="margin:14px 0 6px">60 saniyede söyle</h4><div class="script-text">${esc(x.text)}</div>
 <h4 style="margin:14px 0 6px">Hastaya fayda / avantaj</h4>${(p.benefits||[]).slice(0,4).map(v=>`<div class="row"><div>✓ ${esc(v)}</div></div>`).join('')}
 <div class="ok" style="margin-top:12px"><b>Kapanış:</b> “Hocam, bu profile uyan ilk hastanızda ${p.name}’ı değerlendirir misiniz?”</div>
 <div class="notice" style="margin-top:10px"><b>Pratik:</b> Hekim ilgi gösterirse “Çalışmalar” ve “SUT / ICD / Ödeme” sekmesine geç.</div></div>`;
}
function studyCard(s){return `<div class="study"><h4>${esc(s.name)}</h4><div class="kv"><div class="k">Tür</div><div>${esc(s.type)}</div></div><div class="kv"><div class="k">Hasta</div><div>${esc(s.population)}</div></div><div class="kv"><div class="k">Tasarım</div><div>${esc(s.design)}</div></div><div class="kv"><div class="k">Sonuç</div><div><b>${esc(s.result)}</b></div></div><div class="kv"><div class="k">Saha</div><div>${esc(s.field)}</div></div><div class="kv"><div class="k">Dikkat</div><div>${esc(s.warning)}</div></div></div>`}
function compCard(c){return `<div class="comp"><div class="comp-head"><div><b>${esc(c.brand)}</b> <span class="muted">• ${esc(c.company)}</span></div><span class="type">${esc(c.type)}</span></div><small>${esc(c.detail)}<br><b>${esc(c.price)}</b></small></div>`}
function paymentCard(r){return `<div class="study"><h4>${esc(r.title)}</h4>
 <div class="kv"><div class="k">ICD / Tanı</div><div>${esc(r.icd)}</div></div>
 <div class="kv"><div class="k">Hekim</div><div>${esc(r.doctor)}</div></div>
 <div class="kv"><div class="k">Rapor</div><div>${esc(r.report)}</div></div>
 <div class="kv"><div class="k">Kriter</div><div><b>${esc(r.criteria)}</b></div></div>
 <div class="kv"><div class="k">Şablon</div><div class="close">${esc(r.template)}</div></div>
 <div class="kv"><div class="k">Dikkat</div><div>${esc(r.note||'')}</div></div></div>`}
function quick(){
 const first=Object.keys(DATA)[0];
 app.innerHTML=`<div class="card"><h2 style="margin-top:0">⚡ 60 Saniye Hızlı Seçim</h2><label>İlaç</label><select id="qp" onchange="quickSpecs()">${Object.entries(DATA).map(([id,p])=>`<option value="${id}">${p.name}</option>`).join('')}</select><div id="qsWrap" style="margin-top:10px"></div><div id="qo"></div></div>`;
 quickSpecs();
}
function quickSpecs(){
 const id=document.getElementById('qp').value,p=DATA[id];
 document.getElementById('qsWrap').innerHTML=`<label>Uzmanlık</label><select id="qs" onchange="quickOut()">${specs(p).map(s=>`<option>${s}</option>`).join('')}</select>`;
 quickOut();
}
function quickOut(){const id=document.getElementById('qp').value,s=document.getElementById('qs').value;document.getElementById('qo').innerHTML=scriptCard(id,s)}
function studiesAll(){app.innerHTML=`<h2>▤ Tüm Çalışmalar</h2>${Object.values(DATA).map(p=>`<h3 class="section-title">${p.name}</h3>${p.studies.map(studyCard).join('')}`).join('')}`}
function pricesAll(){app.innerHTML=`<h2>₺ Tüm Formlar & Fiyatlar</h2>${Object.values(DATA).map(p=>`<div class="card" style="margin-bottom:10px"><h3 style="margin-top:0">${p.name}</h3><div class="muted">Kontrol: ${p.price_date}</div>${p.forms.map(x=>`<div class="row"><div><b>${x.form}</b><div class="muted">${x.pack}</div></div><div class="value">${x.price}</div></div>`).join('')}</div>`).join('')}`}
function competitorsAll(){app.innerHTML=`<h2>⇄ Tüm Rakipler</h2>${Object.values(DATA).map(p=>`<div class="card" style="margin-bottom:10px"><h3 style="margin-top:0">${p.name}</h3>${p.competitors.map(compCard).join('')}</div>`).join('')}`}
function searchApp(v){
 const q=v.trim().toLocaleLowerCase('tr-TR');if(q.length<2)return;
 let hits=[];
 Object.entries(DATA).forEach(([id,p])=>{
   const blob=JSON.stringify(p).toLocaleLowerCase('tr-TR');
   if(blob.includes(q))hits.push([id,p]);
 });
 app.innerHTML=`<button class="back" onclick="home()">← Ana sayfa</button><h3 class="section-title">Arama: ${esc(v)}</h3>${hits.length?hits.map(([id,p])=>`<div class="card" style="margin-bottom:9px" onclick="openProduct('${id}')"><b>${p.name}</b><div class="active">${p.active} • ${p.studies.length} çalışma • ${p.competitors.length} rakip</div></div>`).join(''):'<div class="card">Sonuç bulunamadı.</div>'}`;
}
home();
</script></body></html>
