u. Bültendeki algoritmada eGFR ve KBH riski tedavi öncesi temel değerlendirme olarak yer alıyor. Calira-Met XR dapagliflozin + XR metformin içerdiği için dapagliflozin renal kanıtının yanında metformin sınırlarına da uymamız gerekiyor. Güncel KÜB’e göre renal fonksiyonu uygun Tip 2 diyabet hastanızda Calira-Met XR’ı değerlendirir misiniz?"}}}, "ator": {"name": "Ator", "active": "Atorvastatin", "company": "Sanovel", "forms": [{"form": "10 mg film tablet", "pack": "30 tablet", "price": "175,54 TL"}, {"form": "10 mg film tablet", "pack": "90 tablet", "price": "518,00 TL"}, {"form": "20 mg film tablet", "pack": "30 tablet", "price": "281,22 TL"}, {"form": "20 mg film tablet", "pack": "90 tablet", "price": "518,00 TL"}, {"form": "40 mg film tablet", "pack": "30 tablet", "price": "334,96 TL"}, {"form": "40 mg film tablet", "pack": "90 tablet", "price": "518,00 TL"}, {"form": "80 mg film tablet", "pack": "30 tablet", "price": "426,26 TL"}, {"form": "80 mg film tablet", "pack": "90 tablet", "price": "669,29 TL"}], "price_date": "14.09.2026", "competitors": [{"brand": "LIPITOR", "company": "Viatris", "detail": "Atorvastatin 10 / 20 / 40 / 80 mg", "price": "20 mg / 90 tb: 517,97 TL", "type": "Aynı molekül"}, {"brand": "TARDEN", "company": "Abdi İbrahim", "detail": "Atorvastatin 10 / 20 / 40 / 80 mg", "price": "20 mg / 30 tb: 281,22 TL", "type": "Aynı molekül"}, {"brand": "ALVASTIN", "company": "Ali Raif", "detail": "Atorvastatin 10 / 20 / 40 / 80 mg", "price": "40 mg / 30 tb: 334,96 TL", "type": "Aynı molekül"}, {"brand": "ATEROZ", "company": "Bilim İlaç", "detail": "Atorvastatin 10 / 20 / 40 / 80 mg", "price": "40 mg / 30 tb: 334,96 TL", "type": "Aynı molekül"}, {"brand": "LIPIDRA", "company": "Nobel", "detail": "Atorvastatin 10 / 20 / 40 / 80 mg", "price": "40 mg / 30 tb: 803,15 TL", "type": "Aynı molekül"}, {"brand": "KOLESTOR", "company": "Sanofi", "detail": "Atorvastatin 10 / 20 / 40 / 80 mg", "price": "—", "type": "Aynı molekül"}, {"brand": "LIPITAKSIN", "company": "Actavis", "detail": "Atorvastatin 10 / 20 / 40 mg ve diğer formlar", "price": "—", "type": "Aynı molekül"}, {"brand": "AMVASTAN", "company": "World Medicine", "detail": "Atorvastatin 10 / 20 mg ve diğer formlar", "price": "—", "type": "Aynı molekül"}, {"brand": "SAPHIRE", "company": "Aset", "detail": "Atorvastatin 10 / 20 / 40 / 80 mg", "price": "—", "type": "Aynı molekül"}], "sut": "LDL-K >190 mg/dL: ek risk faktörü aranmadan. >160: 2 ek risk faktörü. >130: 3 ek risk faktörü. >70: diabetes mellitus veya belirlenmiş KVH varsa. 160/130 için ek risk faktörleri: hipertansiyon, ailede erken KVH öyküsü, ≥65 yaş. İlk rapor öncesi LDL ölçüm ayrıntıları ve tedavi arası kuralları için güncel SUT esas alınır.", "studies": [{"name": "CARDS", "type": "Primer korunma – Tip 2 diyabet", "population": "2.838 Tip 2 diyabetli; bilinen KVH olmadan ek risk faktörü bulunan hasta", "design": "Atorvastatin 10 mg vs plasebo; çalışma erken sonlandırıldı.", "result": "Bültendeki hızlı mesaj: majör KV olay %37, inme %48, tüm nedenlere bağlı ölüm %27 azalma.", "field": "Dahiliye ve Endokrin için ana çalışma.", "warning": "Yüzdeleri bağlamıyla ve primer korunma popülasyonuyla birlikte söyle."}, {"name": "ASCOT-LLA", "type": "Primer korunma – hipertansiyon", "population": "Hipertansiyon + çoklu KV risk faktörü olan hastalar", "design": "Atorvastatin 10 mg vs plasebo; erken sonlandırılan çalışma.", "result": "Fatal KKH + nonfatal MI riskini belirgin azalttı; erken statin kullanımını destekleyen temel kanıtlardan.", "field": "Dahiliye/Kardiyoloji risk hastası.", "warning": "Çalışma popülasyonu ve başlangıç lipid düzeyi bağlamı korunmalı."}, {"name": "TNT", "type": "Yoğun vs standart atorvastatin", "population": "Stabil koroner kalp hastalığı", "design": "Atorvastatin 80 mg vs 10 mg.", "result": "Daha yoğun LDL düşüşü majör kardiyovasküler olayları azalttı; yüksek dozda karaciğer enzim yükselmesi daha sık görüldü.", "field": "Kardiyoloji – hedef LDL ve tedavi yoğunluğu.", "warning": "Doz seçimi tolera de doz ayarlaması gerektirmediği vurgulanır.", "field": "Nefroloji.", "warning": "Hastanın genel güvenlilik değerlendirmesi ve KÜB uyarıları yine geçerlidir."}], "scripts": {"Kardiyoloji": {"focus": "Sekonder korunma + LDL yoğunluğu", "text": "Hocam, aterosklerotik riskte en kritik noktalardan biri hedef LDL’ye gecikmeden ulaşmak. TNT ve PROVE IT gibi çalışmalar yoğun atorvastatin tedavisinin yüksek riskli koroner hastada daha düşük LDL ve daha az klinik olay yaklaşımını desteklediğini gösteriyor. Ator 10, 20, 40 ve 80 mg; 30 ve 90 tablet seçenekleriyle doz titrasyonuna geniş alan bırakıyor. SUT’ta yerleşik KVH varlığında LDL-K 70 mg/dL üzeri eşik önemli. Hedefin üzerinde kalan uygun hastanızda Ator’u değerlendirir misiniz?"}, "Dahiliye": {"focus": "Tip 2 DM + primer korunma", "text": "Hocam, Tip 2 diyabetli hastada kardiyovasküler risk olay olmadan önce başlıyor. CARDS verisinde 10 mg atorvastatinle majör KV olaylarda yüzde 37, inmede yüzde 48 ve tüm nedenlere bağlı ölümde yüzde 27 azalma mesajı öne çıkıyor. SUT’ta diyabet varlığında LDL-K 70 mg/dL üzeri eşik önemli. Ator’un 10’dan 80 mg’a kadar doz seçenekleri var. Uygun diyabetik hastanızda statini geciktirmeden Ator’u değerlendirir misiniz?"}, "Endokrinoloji": {"focus": "Diyabetik dislipidemi", "text": "Hocam, diyabette HbA1c kadar LDL yönetimi de kardiyovasküler korunmanın temel parçası. CARDS, 10 mg atorvastatinle Tip 2 diyabette primer korunmada majör KV olay yüzde 37 ve inme yüzde 48 azalma mesajıyla güçlü bir hatırlatma. SUT’ta diabetes mellitus varlığında LDL-K 70 mg/dL üzeri kriteri öne çıkıyor. Hedef LDL’nin üzerinde kalan uygun diyabetik hastanızda Ator’u doz ihtiyacına göre değerlendirir misiniz?"}, "Nefroloji": {"focus": "KBH + lipid yönetimi", "text": "Hocam, kronik böbrek hastasında kardiyovasküler risk yüksek; statin seçiminde renal doz karmaşası da pratik bir sorun. Atorvastatin karaciğerde metabolize oluyor ve bültende böbrek yetersizliği seviyelerinde renal doz ayarlaması gerekmediği özellikle v }
